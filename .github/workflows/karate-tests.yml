name: Karate API Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:

      environment:
        description: 'Select environment'
        required: true
        default: 'qa'
        type: choice
        options:
          - qa
          - uat

      tag:
        description: 'Select test tag'
        required: true
        default: '@data'
        type: choice
        options:
          - '@data'
          - '@smoke'
          - '@regression'

jobs:

  karate-tests:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Run Karate tests
        run: |
          mvn clean test \
            -Dkarate.env=${{ inputs.environment }} \
            -Dkarate.tag=${{ inputs.tag }}

      - name: Upload Karate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karate-reports
          path: target/karate-reports/